<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MUD — Client</title>
    <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body>
    <div id="app">
        <header class="topbar">
            <div class="title">MUD</div>
            <div class="status">
                <span class="status-item">Player: <strong id="playerName">—</strong></span>
                <span class="status-item">HP: <strong id="hp">0</strong></span>
                <span class="status-item">XP: <strong id="xp">0</strong></span>
                <button id="invBtn" class="inv-button">Inventory</button>
            </div>
        </header>

        <main class="main">
            <section class="room card">
                <h2 id="roomTitle">Loading…</h2>
                <p id="roomDesc" class="muted">Waiting for room data.</p>

                <div class="meta-row">
                    <div class="badges">
                        <strong>Exits:</strong>
                        <span id="exits" class="badge-row"></span>
                    </div>
                    <div class="badges">
                        <strong>NPCs:</strong>
                        <span id="npcs" class="badge-row"></span>
                    </div>
                    <div class="badges">
                        <strong>Players:</strong>
                        <span id="players" class="badge-row"></span>
                    </div>

                    <div class="badges">
                        <strong>Items:</strong>
                        <span id="items" class="badge-row"></span>
                    </div>
                </div>
            </section>

            <section class="log card">
                <div id="log" class="logpane" aria-live="polite"></div>
            </section>
        </main>

        <footer class="inputbar">
            <div class="quick">
                <button data-cmd="look">Look</button>
                <button data-cmd="n">N</button>
                <button data-cmd="s">S</button>
                <button data-cmd="e">E</button>
                <button data-cmd="w">W</button>
                <button data-cmd="up">U</button>
                <button data-cmd="down">D</button>
            </div>

            <form id="cmdForm" class="cmd">
                <input id="cmdInput" autocomplete="off" placeholder="Enter command (or press a quick button)..." />
                <button type="submit">Send</button>
            </form>
        </footer>
    </div>

    <!-- Inventory Modal -->
    <div id="invModal" class="modal-backdrop" aria-hidden="true">
        <div class="modal">
            <header class="modal-header">
                <h3>Inventory</h3>
                <button id="invClose" class="close">×</button>
            </header>

            <div class="modal-body">
                <table id="invTable" class="inv-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Weight</th>
                            <th>Condition</th>
                            <th>Category</th>
                            <th>Short Description</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- populated dynamically -->
                    </tbody>
                </table>
                <div id="invEmpty" class="muted" style="display:none">You are carrying nothing.</div>
            </div>

            <footer class="modal-footer">
                <button id="invRefresh">Refresh</button>
                <button id="invClose2">Close</button>
            </footer>
        </div>
    </div>

    <script>
        const host = location.hostname || 'localhost';
        const port = 9250;
        const ws = new WebSocket(`ws://${host}:${port}`);

        const playerNameEl = document.getElementById('playerName');
        const hpEl = document.getElementById('hp');
        const xpEl = document.getElementById('xp');
        const roomTitleEl = document.getElementById('roomTitle');
        const roomDescEl = document.getElementById('roomDesc');
        const exitsEl = document.getElementById('exits');
        const npcsEl = document.getElementById('npcs');
        const itemsEl = document.getElementById('items');
        const playersEl = document.getElementById('players');
        const logEl = document.getElementById('log');
        const cmdForm = document.getElementById('cmdForm');
        const cmdInput = document.getElementById('cmdInput');

        // top bar title element
        const siteTitleEl = document.querySelector('.title');

        // Inventory modal elements
        const invBtn = document.getElementById('invBtn');
        const invModal = document.getElementById('invModal');
        const invClose = document.getElementById('invClose');
        const invClose2 = document.getElementById('invClose2');
        const invRefresh = document.getElementById('invRefresh');
        const invTableBody = document.querySelector('#invTable tbody');
        const invEmpty = document.getElementById('invEmpty');

        function addLog(text, cls = '') {
            const el = document.createElement('div');
            el.className = 'log-line ' + cls;
            if (cls === 'system') {
                const safe = text.replace(/<script/gi, '&lt;script');
                el.innerHTML = safe;
            } else {
                el.textContent = text;
            }
            logEl.appendChild(el);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function openInventory() {
            invModal.setAttribute('aria-hidden', 'false');
            invModal.style.display = 'flex';
            requestInventory();
        }

        function closeInventory() {
            invModal.setAttribute('aria-hidden', 'true');
            invModal.style.display = 'none';
        }

        function renderInventory(items) {
            invTableBody.innerHTML = '';
            if (!items || items.length === 0) {
                invEmpty.style.display = 'block';
                document.querySelector('#invTable').style.display = 'none';
                return;
            }
            invEmpty.style.display = 'none';
            document.querySelector('#invTable').style.display = '';
            items.forEach(it => {
                let status = '';
                const wearLoc = it.wearLoc || '';
                const isWorn = !!it.isWorn;
                const isHeld = !!it.isHeld;

                if (isWorn && wearLoc) {
                    status = `Worn on ${wearLoc}`;
                } else if (isHeld) {
                    status = `Held`;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
          <td>${escapeHtml(it.name)}</td>
          <td>${escapeHtml(String(it.weight ?? ''))}</td>
          <td>${escapeHtml(String(it.condition ?? ''))}</td>
          <td>${escapeHtml(it.itemCategory ?? '')}</td>
          <td>${escapeHtml(it.shortDesc ?? '')}</td>
          <td>${escapeHtml(status)}</td>
        `;
                invTableBody.appendChild(tr);
            });
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        function requestInventory() {
            const payload = JSON.stringify({ type: 'command', text: 'inventory' });
            ws.send(payload);
            addLog('> inventory', 'you');
        }

        ws.addEventListener('open', () => addLog('Connected to server', 'system'));
        ws.addEventListener('close', () => addLog('Disconnected', 'system'));
        ws.addEventListener('error', e => addLog('WebSocket error', 'error'));

        ws.addEventListener('message', evt => {
            console.log('[WS rx]', evt.data);
            try {
                const msg = JSON.parse(evt.data);

                if (msg.type === 'room') {
                    let title = msg.title || '';
                    let desc = msg.description || '';

                    if (!title && desc) {
                        const parts = desc.split('\n');
                        title = parts[0].replace(/\*\*/g, '').trim();
                        desc = parts.slice(1).join('\n').trim();
                    }

                    roomTitleEl.textContent = title || 'Unknown room';
                    roomDescEl.textContent = desc || '';

                    // update top title to "WorldName -- AreaName"
                    const worldName = msg.worldName || '';
                    const areaName = msg.areaName || '';
                    if (worldName || areaName) {
                        siteTitleEl.textContent = worldName && areaName ? `${worldName} -- ${areaName}` : (worldName || areaName || 'MUD');
                        document.title = siteTitleEl.textContent;
                    }

                    exitsEl.innerHTML = (msg.exits || [])
                        .map(e => {
                            const dir = e.direction ?? e.Direction ?? '';
                            const t = e.title ?? e.Title ?? '';
                            return `<span class="badge exit">${dir}${t ? ': ' + t : ''}</span>`;
                        })
                        .join(' ');

                    if (npcsEl) {
                        npcsEl.innerHTML = (msg.npcs || []).map(n => `<span class="badge">${n}</span>`).join(' ');
                    }

                    if (playersEl) {
                        playersEl.innerHTML = (msg.players || []).map(p => `<span class="badge">${p}</span>`).join(' ');
                    }

                    if (itemsEl) {
                        itemsEl.innerHTML = (msg.items || []).map(i => `<span class="badge item">${i}</span>`).join(' ');
                    }

                    addLog(title ? `You look at ${title}` : `You look around`, 'info');
                    return;
                }

                if (msg.type === 'exits') {
                    exitsEl.innerHTML = (msg.exits || [])
                        .map(e => {
                            const dir = e.direction ?? e.Direction ?? '';
                            const t = e.title ?? e.Title ?? '';
                            return `<span class="badge exit">${dir}${t ? ': ' + t : ''}</span>`;
                        }).join(' ');
                    return;
                }

                if (msg.type === 'player_update') {
                    playerNameEl.textContent = msg.name || '—';
                    hpEl.textContent = `${msg.currentHealth ?? 0}/${msg.maxHealth ?? 0}`;
                    if (xpEl) xpEl.textContent = String(msg.experience ?? 0);
                    return;
                }

                if (msg.type === 'inventory') {
                    renderInventory(msg.inventory || []);
                    return;
                }

                if (msg.type === 'system') { addLog(msg.text || '[system]', 'system'); return; }
                if (msg.type === 'chat') { addLog(msg.text || '', 'chat'); return; }

                addLog(JSON.stringify(msg), 'debug');
            } catch {
                addLog(evt.data, 'raw');
            }
        });

        document.querySelectorAll('.quick button').forEach(b => {
            b.addEventListener('click', () => {
                const c = b.getAttribute('data-cmd');
                if (c) {
                    sendCommand(c);
                }
            });
        });

        function sendCommand(text) {
            const payload = JSON.stringify({ type: 'command', text });
            ws.send(payload);
            addLog('> ' + text, 'you');
        }

        const history = [];
        let cursor = -1;

        function recordCommand(cmd) {
            if (!cmd || !cmd.trim()) return;
            if (history.length > 0 && history[0] === cmd) return;
            history.unshift(cmd);
            if (history.length > 3) history.pop();
            cursor = -1;
        }

        function historyPrev() {
            if (history.length === 0) return;
            if (cursor < history.length - 1) cursor++;
            cmdInput.value = history[cursor] || '';
            cmdInput.setSelectionRange(cmdInput.value.length, cmdInput.value.length);
        }

        function historyNext() {
            if (history.length === 0) return;
            if (cursor <= 0) {
                cursor = -1;
                cmdInput.value = '';
            } else {
                cursor--;
                cmdInput.value = history[cursor] || '';
            }
            cmdInput.setSelectionRange(cmdInput.value.length, cmdInput.value.length);
        }

        cmdForm.addEventListener('submit', e => {
            e.preventDefault();
            const text = cmdInput.value.trim();
            if (!text) return;
            recordCommand(text);
            sendCommand(text);
            cmdInput.value = '';
        });

        cmdInput.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp') { e.preventDefault(); historyPrev(); }
            if (e.key === 'ArrowDown') { e.preventDefault(); historyNext(); }
        });

        invBtn.addEventListener('click', openInventory);
        invClose.addEventListener('click', closeInventory);
        invClose2.addEventListener('click', closeInventory);
        invRefresh.addEventListener('click', requestInventory);

        window.addEventListener('keydown', e => {
            if (e.key === '/') { e.preventDefault(); cmdInput.focus(); }
            if (e.key === 'Escape' && invModal.style.display === 'flex') closeInventory();
        });

        invModal.style.display = 'none';
    </script>
</body>
</html>
